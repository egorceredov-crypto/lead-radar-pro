version: '3.8'
services:
  bot:
    build: .
    command: python -m app.manage bot
    volumes:
      - ./:/app
      - db_data:/app/data
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  db_data:
