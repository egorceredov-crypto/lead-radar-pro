version: '3.8'
services:
  bot:
    build: .
    command: python -m app.manage bot
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
  parser:
    build: .
    command: python -m app.parser.worker
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
  ai_worker:
    build: .
    command: python -m app.ai.worker
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build: .
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lead_radar}
      POSTGRES_USER: ${POSTGRES_USER:-lr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lr_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
